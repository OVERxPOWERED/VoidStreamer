openapi: 3.1.0
info:
  title: voidsStreamer API
  version: 1.0.0
  description: |
    REST API for searching and resolving streaming sources.
    Provides endpoints for stream search, resolution, source listing, and health checks.
  contact:
    name: voidsStreamer Team
    email: support@voidsstreamer.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.voidsstreamer.example.com
    description: Production server

security:
  - ApiKeyAuth: []

tags:
  - name: Streams
    description: Stream search and resolution operations
  - name: Sources
    description: Source management and listing
  - name: Health
    description: Health check and system status

paths:
  /api/streams/search:
    get:
      summary: Search for streams
      description: |
        Search for streaming content by query, type, and optional filters.
        Returns a paginated list of stream results with basic metadata.
      operationId: searchStreams
      tags:
        - Streams
      security:
        - ApiKeyAuth: []
      parameters:
        - name: q
          in: query
          description: Search query string
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
            example: "The Matrix"
        - name: type
          in: query
          description: Type of content to search for
          required: true
          schema:
            type: string
            enum: [movie, series, anime]
            example: movie
        - name: page
          in: query
          description: Page number for pagination (1-indexed)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          description: Number of results per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            example: 20
        - name: year
          in: query
          description: Filter by release year
          required: false
          schema:
            type: integer
            minimum: 1900
            maximum: 2100
            example: 1999
        - name: genre
          in: query
          description: Filter by genre
          required: false
          schema:
            type: string
            example: "sci-fi"
      responses:
        '200':
          description: Successful search response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamSearchResponse'
              examples:
                success:
                  summary: Successful search for "The Matrix"
                  value:
                    results:
                      - id: "tt0133093"
                        title: "The Matrix"
                        type: "movie"
                        year: 1999
                        poster: "https://image.tmdb.org/t/p/w500/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg"
                        overview: "A computer hacker learns from mysterious rebels about the true nature of his reality and his role in the war against its controllers."
                        genres: ["Action", "Sci-Fi"]
                        rating: 8.7
                      - id: "tt0234215"
                        title: "The Matrix Reloaded"
                        type: "movie"
                        year: 2003
                        poster: "https://image.tmdb.org/t/p/w500/9TGHDvWrq4bUo2FZM1YJxNQZPVT.jpg"
                        overview: "Neo and the rebel leaders estimate that they have 72 hours until 250,000 probes discover Zion and destroy it and its inhabitants."
                        genres: ["Action", "Sci-Fi"]
                        rating: 7.2
                    pagination:
                      page: 1
                      limit: 20
                      totalResults: 2
                      totalPages: 1
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Missing required parameter
                  value:
                    error: "ValidationError"
                    message: "Query parameter 'q' is required"
                    statusCode: 400
                    details:
                      - field: "q"
                        message: "Search query is required"
        '401':
          description: Unauthorized - invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Invalid API key
                  value:
                    error: "UnauthorizedError"
                    message: "Invalid or missing API key"
                    statusCode: 401
        '429':
          description: Too many requests - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rate_limited:
                  summary: Rate limit exceeded
                  value:
                    error: "RateLimitError"
                    message: "Rate limit exceeded. Please try again later."
                    statusCode: 429
                    retryAfter: 60
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                server_error:
                  summary: Internal server error
                  value:
                    error: "InternalServerError"
                    message: "An unexpected error occurred"
                    statusCode: 500
        '503':
          description: Service unavailable - upstream services down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                service_unavailable:
                  summary: Upstream service unavailable
                  value:
                    error: "ServiceUnavailableError"
                    message: "Upstream search service is temporarily unavailable"
                    statusCode: 503
                    retryAfter: 30

  /api/streams:
    get:
      summary: List streams
      description: |
        Retrieve a paginated list of streams with optional filtering.
        Supports filtering by type, genre, year range, and sorting.
      operationId: listStreams
      tags:
        - Streams
      security:
        - ApiKeyAuth: []
      parameters:
        - name: type
          in: query
          description: Filter by content type
          required: false
          schema:
            type: string
            enum: [movie, series, anime]
            example: movie
        - name: genre
          in: query
          description: Filter by genre
          required: false
          schema:
            type: string
            example: "action